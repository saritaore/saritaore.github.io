rder:2px solid transparent;border-radius:3px;background:0;cursor:pointer;opacity:.55}.fw-thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}.fw-thumb:hover{opacity:.85}.fw-thumb.is-active{opacity:1;border-color:var(--global-theme-color)}.fw-thumb:focus-visible,.fw-arrow:focus-visible{outline:2px solid var(--global-theme-color);outline-offset:2px;opacity:1}@media(max-width:576px){.fw-arrow{width:36px;height:36px;font-size:1.4rem}.fw-thumb{width:64px;height:46px}}@media(prefers-reduced-motion:reduce){.fw-thumbs{scroll-behavior:auto}}</style> <script>
  (function () {
    var root = document.getElementById("fw-gallery");
    if (!root) return;
    var slides = root.querySelectorAll(".fw-slide");
    var thumbs = root.querySelectorAll(".fw-thumb");
    var n = slides.length, current = 0;
    if (n < 2) {
      root.querySelectorAll(".fw-arrow").forEach(function (b) { b.style.display = "none"; });
      return;
    }

    function show(i) {
      current = (i + n) % n;
      slides.forEach(function (s, k) { s.classList.toggle("is-active", k === current); });
      thumbs.forEach(function (t, k) {
        var on = k === current;
        t.classList.toggle("is-active", on);
        if (on) {
          var strip = t.parentElement;
          strip.scrollLeft = t.offsetLeft - strip.clientWidth / 2 + t.clientWidth / 2;
        }
      });
    }

    root.querySelector(".fw-prev").addEventListener("click", function () { show(current - 1); });
    root.querySelector(".fw-next").addEventListener("click", function () { show(current + 1); });
    thumbs.forEach(function (t) {
      t.addEventListener("click", function () { show(parseInt(t.dataset.index, 10)); });
    });
    document.addEventListener("keydown", function (e) {
      if (e.target.matches("input, textarea, [contenteditable]")) return;
      if (e.key === "ArrowLeft") show(current - 1);
      if (e.key === "ArrowRight") show(current + 1);
    });

    // Swipe on phones
    var x0 = null;
    var stage = root.querySelector(".fw-stage");
    stage.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
      x0 = null;
    });
  })();
